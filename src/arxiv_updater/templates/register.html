{% extends "base.html" %}
{% block title %}接受邀请 · arXiv 智能文章更新器{% endblock %}
{% block body %}
<main class="auth-shell">
  <section class="auth-card">
    <p class="eyebrow">INVITED ACCESS</p>
    <h1>创建组内账号</h1>
    {% if error %}<p class="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/register" class="stack">
      <input type="hidden" name="invite" value="{{ invite }}">
      <label>姓名<input name="display_name" required></label>
      <label>邮箱<input type="email" name="email" required autocomplete="email"></label>
      <label>密码<input type="password" name="password" minlength="10" required autocomplete="new-password"></label>
      <button type="submit">注册并进入</button>
    </form>
  </section>
</main>
{% endblock %}

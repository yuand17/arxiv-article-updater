<div class="summary-panel">
  <div class="summary-heading"><span>AI</span><strong>Abstract summary</strong><small>English · based on abstract</small></div>
  {% if summary %}
    <p class="tldr">{{ summary.tldr }}</p>
  {% else %}
    <p class="muted">AI summarization is not configured yet. You can still open the original paper.</p>
  {% endif %}
  <div class="external-links">
    {% if paper.pdf_url or paper.canonical_url %}<a href="/papers/{{ paper.id }}/fulltext" target="_blank" rel="noopener">阅读全文 ↗</a>{% endif %}
    {% if paper.doi %}<a href="https://doi.org/{{ paper.doi }}" target="_blank" rel="noopener">DOI ↗</a>{% endif %}
  </div>
</div>

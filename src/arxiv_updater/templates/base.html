<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}arXiv Updater{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', path='icons/arxiv-updater.ico') }}" sizes="any">
    <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}?v=20260814-math-abstract-fix">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.0/dist/katex.min.css" integrity="sha384-KfwFj/Q/jGrY4ijtfzWyW5NXzT5irvfnTq6aRnH2xPvLzLdi1XyVr7w4l2uwTq0V" crossorigin="anonymous">
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.18.0/dist/katex.min.js" integrity="sha384-OE4SMRr5gMJQzKSD08J46vKsKgY8NxVtO1LW+/q3NJ0WHsGsdN4oebgEjwwWuyvG" crossorigin="anonymous" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.18.0/dist/contrib/auto-render.min.js" integrity="sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz" crossorigin="anonymous" defer></script>
    <script src="{{ url_for('static', path='app.js') }}?v=20260814-math-abstract-fix-2" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="arXiv Updater">
        <img class="brand-logo" src="{{ url_for('static', path='arxiv-logo-primary-light.svg') }}" alt="arXiv">
        <span class="brand-label">Updater</span>
      </a>
      <nav class="desktop-nav" aria-label="主要导航">
        <a href="/?view=featured">三天精选</a>
        <a href="/?view=all">全部更新</a>
        <a href="/?view=saved">收藏</a>
        <a href="/settings">设置</a>
      </nav>
      <span class="local-badge">仅本机</span>
    </header>
    {% block body %}{% endblock %}
    <div id="toast-region" class="toast-region" aria-label="操作通知" aria-live="polite"></div>
  </body>
</html>

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arxiv-article-updater"
version = "0.1.0"
description = "A lightweight, personalized research paper dashboard."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "apscheduler>=3.11,<4",
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.115,<1",
  "feedparser>=6.0,<7",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "openai>=1.68,<3",
  "playwright>=1.52,<2",
  "pillow>=11.3,<12",
  "pystray>=0.19.5,<1",
  "pydantic-settings>=2.8,<3",
  "python-dateutil>=2.9,<3",
  "python-multipart>=0.0.20,<1",
  "rapidfuzz>=3.12,<4",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
  "tzdata>=2025.2; platform_system == 'Windows'",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
  "types-python-dateutil>=2.9,<3",
]

[project.scripts]
arxiv-updater = "arxiv_updater.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_updater"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["browser: end-to-end browser tests requiring a local Chromium installation"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
packages = ["arxiv_updater"]
ignore_missing_imports = true
warn_unused_ignores = true

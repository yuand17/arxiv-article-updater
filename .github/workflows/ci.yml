name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest -m "not browser" --cov=arxiv_updater --cov-report=term-missing
      - name: Verify Alembic upgrade and schema drift
        env:
          DATABASE_URL: sqlite:///./migration-ci.db
        run: |
          alembic upgrade head
          alembic check

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest -m browser

  windows-release-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install "build>=1.2,<2"
          python -m build --wheel
      - name: Verify clean wheel database initialization
        shell: pwsh
        run: |
          $wheel = (Resolve-Path 'dist\*.whl').Path
          python -m venv wheel-smoke
          .\wheel-smoke\Scripts\python.exe -m pip install $wheel
          $env:DATABASE_URL = 'sqlite:///./wheel-smoke.db'
          $env:PYTHON_KEYRING_BACKEND = 'keyring.backends.null.Keyring'
          .\wheel-smoke\Scripts\arxiv-updater.exe init-db
          .\wheel-smoke\Scripts\arxiv-updater.exe doctor
          .\wheel-smoke\Scripts\python.exe -c "import sqlite3; connection = sqlite3.connect('wheel-smoke.db'); assert connection.execute('select version_num from alembic_version').fetchone() == ('0007',)"
      - name: Verify Windows tray and shortcuts
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e '.[dev]'
          .\.venv\Scripts\python.exe -m pytest tests\test_tray_controller.py
          powershell.exe -ExecutionPolicy Bypass -File scripts\install_windows_shortcuts.ps1
          $desktopLink = Join-Path ([Environment]::GetFolderPath('Desktop')) 'arXiv Updater.lnk'
          $startupLink = Join-Path ([Environment]::GetFolderPath('Startup')) 'arXiv Updater Background.lnk'
          if (-not (Test-Path -LiteralPath $desktopLink -PathType Leaf)) { throw 'Desktop shortcut missing' }
          if (-not (Test-Path -LiteralPath $startupLink -PathType Leaf)) { throw 'Startup shortcut missing' }

  windows-packaged-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build portable Windows application
        shell: pwsh
        run: |
          python -m pip install -e '.[release]'
          pyinstaller --clean --noconfirm packaging\arxiv_updater_windows.spec
      - name: Smoke-test packaged Windows service
        shell: pwsh
        run: |
          $env:ARXIV_UPDATER_STATE_DIR = Join-Path $env:RUNNER_TEMP 'arxiv-updater-state'
          $env:ARXIV_UPDATER_PORT = '18080'
          $env:ARXIV_UPDATER_IPC_PORT = '18731'
          $env:ARXIV_UPDATER_MUTEX_NAME = 'Local\arXivUpdaterControllerCI'
          $env:PYTHON_KEYRING_BACKEND = 'keyring.backends.null.Keyring'
          $process = Start-Process -FilePath '.\dist\arXiv Updater\arXiv Updater.exe' -ArgumentList '--smoke-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged smoke test exited $($process.ExitCode)" }
          if (-not (Test-Path -LiteralPath (Join-Path $env:ARXIV_UPDATER_STATE_DIR 'data\arxiv_updater.db'))) {
            throw 'Packaged application did not initialize its database'
          }

  macos-packaged-app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build Apple Silicon menu-bar application
        run: |
          python -m pip install -e '.[release]'
          pyinstaller --clean --noconfirm packaging/arxiv_updater_macos.spec
      - name: Verify app bundle and packaged service
        env:
          PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
          ARXIV_UPDATER_PORT: "18080"
          ARXIV_UPDATER_IPC_PORT: "18731"
        run: |
          codesign --verify --deep --strict 'dist/arXiv Updater.app'
          export ARXIV_UPDATER_STATE_DIR="$RUNNER_TEMP/arxiv-updater-state"
          'dist/arXiv Updater.app/Contents/MacOS/arXiv Updater' --smoke-test
          test -f "$ARXIV_UPDATER_STATE_DIR/data/arxiv_updater.db"
